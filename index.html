<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2330;--grid:#e8edf2;--snake:#1f9d55;--head:#157a41;--food:#e53e3e;--btn:#1b2330;--btntext:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--text:#e8edf3;--grid:#232c38;--snake:#38c172;--head:#6ee7a0;--food:#ff6b6b;--btn:#e8edf3;--btntext:#10151c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--text:#e8edf3;--grid:#232c38;--snake:#38c172;--head:#6ee7a0;--food:#ff6b6b;--btn:#e8edf3;--btntext:#10151c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100vh;touch-action:manipulation}
h1{margin:6px 0;font-size:1.5rem}
.bar{display:flex;gap:10px;width:min(92vw,420px);justify-content:space-between;margin-bottom:8px}
.pill{background:var(--card);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.95rem}
.wrap{position:relative;width:min(92vw,420px)}
canvas{width:100%;aspect-ratio:1;background:var(--card);border-radius:14px;display:block;touch-action:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.45);border-radius:14px;color:#fff;text-align:center}
.over.hide{display:none}
button{border:0;border-radius:12px;background:var(--btn);color:var(--btntext);font-size:1rem;font-weight:700;padding:12px 22px;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;margin-top:14px}
.pad button{padding:0;font-size:1.4rem}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.hint{opacity:.7;font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div class="bar"><div class="pill">Score: <span id="s">0</span></div><div class="pill">Best: <span id="b">0</span></div><button id="p" style="padding:6px 14px">Pause</button></div>
<div class="wrap">
<canvas id="c" width="420" height="420"></canvas>
<div class="over" id="o"><h2 id="t" style="margin:0">Snake</h2><div id="m">Swipe or use arrows</div><button id="go">Play</button></div>
</div>
<div class="pad">
<button class="up" data-d="0,-1">▲</button><button class="left" data-d="-1,0">◀</button><button class="down" data-d="0,1">▼</button><button class="right" data-d="1,0">▶</button>
</div>
<div class="hint">Swipe on the board, tap the arrows, or use the keyboard.</div>
<script>
const N=20,c=document.getElementById('c'),x=c.getContext('2d'),U=c.width/N;
const $=id=>document.getElementById(id);
let snake,dir,next,food,score,best=0,timer,running=false,paused=false,speed;
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
$('b').textContent=best;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;speed=240;$('s').textContent=0;place();running=true;paused=false;$('p').textContent='Pause';$('o').classList.add('hide');clearInterval(timer);timer=setInterval(tick,speed);draw()}
function end(){running=false;clearInterval(timer);if(score>best){best=score;$('b').textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
$('t').textContent='Game over';$('m').textContent='Score: '+score;$('go').textContent='Play again';$('o').classList.remove('hide')}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return end();
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;$('s').textContent=score;place();if(speed>130&&score%4===0){speed-=6;clearInterval(timer);timer=setInterval(tick,speed)}}else snake.pop();
draw()}
function draw(){x.fillStyle=css('--card');x.fillRect(0,0,c.width,c.height);
x.strokeStyle=css('--grid');x.lineWidth=1;for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*U,0);x.lineTo(i*U,c.height);x.stroke();x.beginPath();x.moveTo(0,i*U);x.lineTo(c.width,i*U);x.stroke()}
x.fillStyle=css('--food');x.beginPath();x.arc(food.x*U+U/2,food.y*U+U/2,U*.38,0,7);x.fill();
snake.forEach((s,i)=>{x.fillStyle=css(i?'--snake':'--head');x.beginPath();x.roundRect(s.x*U+1,s.y*U+1,U-2,U-2,5);x.fill()})}
function turn(dx,dy){if(!running||paused)return;if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}
function togglePause(){if(!running)return;paused=!paused;$('p').textContent=paused?'Resume':'Pause';if(paused)clearInterval(timer);else timer=setInterval(tick,speed)}
$('go').onclick=start;$('p').onclick=togglePause;
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const [a,d]=b.dataset.d.split(',').map(Number);turn(a,d)});
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m){e.preventDefault();turn(...m)}else if(e.key===' '){togglePause()}});
let sx,sy;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)},{passive:true});
snake=[{x:10,y:10}];food={x:15,y:10};draw();
</script>
</body>
</html>
